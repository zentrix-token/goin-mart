
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOV MART - Member Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;font-family:Arial,sans-serif;background:#f0f6ef;color:#173b2b}
header{text-align:center;background:#13783f;color:white;padding:24px 12px;border-radius:14px;margin-bottom:20px}
header h1{margin:0 0 8px}
.card{max-width:440px;margin:auto;padding:22px;background:white;border-radius:16px;box-shadow:0 4px 18px #0001}
label{display:block;font-weight:bold;margin:15px 0 6px}
input{width:100%;padding:13px;border:1px solid #cbd8cf;border-radius:9px;font-size:16px}
button{width:100%;padding:14px;margin-top:22px;border:0;border-radius:9px;background:#13783f;color:white;font-size:17px;font-weight:bold}
.note{font-size:13px;line-height:1.6;color:#53665a}
a{color:#13783f}
</style>
</head>
<body>
<header>
<h1>GOV MART</h1>
<div>Shop Smart. Save More.</div>
</header>
<div class="card">
<h2>Member Login</h2>
<p class="note">Sign in to access your GOV MART account.</p>
<form id="loginForm">
<label for="email">Email Address</label>
<input id="email" type="email" autocomplete="username" required>

<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>

<button type="submit">Login</button>
<p class="note" id="message" role="status"></p>
</form>
<p class="note">New member? <a href="register.html">Register here</a></p>
<p class="note"><a href="index.html">Back to Home</a></p>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit",function(e){
  e.preventDefault();
  document.getElementById("message").textContent =
    "Login service is not connected yet.";
});
</script>
</body>
</html>
