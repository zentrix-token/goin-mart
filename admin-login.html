
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOV MART Admin Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#f0f6ef;color:#173b2b}
header,.card{max-width:480px;margin:0 auto 18px;padding:22px;border-radius:15px}
header{background:#13783f;color:white;text-align:center}
.card{background:white}
label{display:block;margin:16px 0 7px;font-weight:bold}
input{width:100%;padding:14px;border:1px solid #d7e1da;border-radius:9px;font-size:16px}
button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:9px;background:#13783f;color:white;font-size:17px;font-weight:bold}
#msg{overflow-wrap:anywhere;line-height:1.5}
</style>
</head>
<body>
<header><h1>GOV MART</h1><p>Administrator Login</p></header>
<section class="card">
<h2>Admin Sign In</h2>
<form id="form">
<label for="username">Username</label>
<input id="username" autocomplete="username"
       required maxlength="30" value="govmartadmin">
<label for="password">Password</label>
<input id="password" type="password"
       autocomplete="current-password" minlength="12" required>
<button id="submit" type="submit">Login to Admin Panel</button>
<p id="msg" role="status" aria-live="polite"></p>
</form>
</section>
<script src="config.js"></script>
<script type="module">
import {createClient} from
'https://esm.sh/@supabase/supabase-js@2';

const cfg=window.GOV_MART_CONFIG;
const form=document.getElementById('form');
const msg=document.getElementById('msg');
const btn=document.getElementById('submit');

if(!cfg?.supabaseUrl||!cfg?.supabaseKey){
  msg.textContent='Supabase configuration is missing.';
  btn.disabled=true;
}else{
  const sb=createClient(cfg.supabaseUrl,cfg.supabaseKey);

  form.addEventListener('submit',async e=>{
    e.preventDefault();
    btn.disabled=true;
    msg.textContent='Verifying admin access...';

    try{
      const username=document.getElementById('username')
        .value.trim();
      const password=document.getElementById('password').value;

      if(username!=='govmartadmin'){
        throw new Error('Invalid admin username or password.');
      }
      if(password.length<12){
        throw new Error('Password must contain at least 12 characters.');
      }

      const {data,error}=await sb.auth.signInWithPassword({
        email:'govmartadmin@govmart.shop',
        password
      });
      if(error) throw new Error('Login failed. Check your password.');

      const {data:admin,error:adminError}=await sb
        .from('gov_mart_admins')
        .select('user_id')
        .eq('user_id',data.user.id)
        .maybeSingle();

      if(adminError) throw new Error(
        'Admin verification failed: '+adminError.message
      );

      if(!admin){
        await sb.auth.signOut();
        throw new Error('This account has no admin permission.');
      }

      location.replace('admin.html');
    }catch(err){
      msg.textContent=err.message||'Login failed.';
    }finally{
      btn.disabled=false;
    }
  });
}
</script>
</body>
</html>
